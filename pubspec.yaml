name: my_app
description: "Smart Study App - Learn Smarter, Not Harder"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.4.0
  hooks_riverpod: ^2.4.0
  flutter_hooks: ^0.20.0
  go_router: ^12.0.0
  dio: ^5.3.0
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.0
  socket_io_client: ^3.1.6
  file_picker: ^8.0.0
  google_fonts: ^6.1.0
  fl_chart: ^0.65.0
  cached_network_image: ^3.3.0
  flutter_animate: ^4.3.0
  shimmer: ^3.0.0
  image_picker: ^1.0.0
  path_provider: ^2.1.0
  pdfx: ^2.9.2
  intl: ^0.18.0
  equatable: ^2.0.5
  uuid: ^4.2.0
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/smart_study_app_icon.png
  web:
    generate: true
    image_path: assets/branding/smart_study_app_icon.png
    background_color: "#4F46E5"
    theme_color: "#4F46E5"
  windows:
    generate: true
    image_path: assets/branding/smart_study_app_icon.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/branding/smart_study_app_icon.png

flutter:
  uses-material-design: true
